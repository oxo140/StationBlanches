<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Station Blanche</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head>
<body><main><a class="brand" href="/login"><span>SB</span> STATION BLANCHE</a><div class="badge">ACCÈS ADMINISTRATEUR</div><h1>Votre espace<br>de supervision.</h1><p>Connectez-vous pour consulter les analyses,<br>les détections et la quarantaine de votre station.</p><form method="post" action="/auth/login"><label for="username">Identifiant</label><input id="username" name="username" autocomplete="username" value="admin" required maxlength="64"><label for="password">Mot de passe administrateur</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus><button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Afficher</button></div><p id="error" role="status" aria-live="polite" hidden></p><button id="submit-login" type="submit">Se connecter <span>↗</span></button></form><p class="back">L’écran d’analyse USB reste disponible sur la station.</p><footer>Connexion chiffrée · Session limitée à 8 heures</footer></main></body></html>
