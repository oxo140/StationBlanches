name: Validate v2
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: for script in installation.sh deploy/*.sh deploy/host/*.sh deploy/clamav/*.sh tests/*.sh; do bash -n "$script"; done
      - run: sudo apt-get update && sudo apt-get install -y shellcheck clamav-daemon netcat-openbsd jq
      - run: shellcheck installation.sh deploy/*.sh deploy/host/*.sh deploy/clamav/*.sh tests/*.sh
      - run: bash tests/installer-checks.sh
      - run: bash tests/network-checks.sh
      - run: bash tests/usb-verifier-checks.sh
      - run: bash tests/clamd-integration.sh
      - run: node --check web/app.js
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t station-blanche/app:test .
      - run: docker build -f deploy/clamav/Dockerfile -t station-blanche/clamav:test .
      - run: bash tests/container-smoke.sh
